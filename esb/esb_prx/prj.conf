CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_ESB=y
CONFIG_DK_LIBRARY=y
CONFIG_CLOCK_CONTROL=y

# Required for ESB on nRF54L15 (DPPIC instance 10).
CONFIG_NRFX_DPPI10=y

# Console UART is shared with the Hub RC link (HUART-RC protocol).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x2000
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ENTROPY_GENERATOR=y

# Required by rc_uart_log_fwd custom log backend.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_OUTPUT=y

# RC servo/ESC PWM via PCA9685 (I2C). Driver selected by DT (nxp,pca9685-pwm).
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PWM=y
# Calibrated for this board (~55 Hz measured when assuming 25 MHz). See Kconfig.
CONFIG_RC_PCA9685_OSC_HZ=27700000

# P1.02/P1.03 default to NFC; release them so Btn1 (pair clear) on P1.02 is a real GPIO.
CONFIG_NFCT_PINS_AS_GPIOS=y
