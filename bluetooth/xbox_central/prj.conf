CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_BT_DEVICE_NAME="GroundHub"

CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
# Xbox controllers are unstable as BLE central when using host privacy (BlueZ/NimBLE).
# CONFIG_BT_PRIVACY is not set
CONFIG_BT_MAX_PAIRED=4

CONFIG_MAIN_STACK_SIZE=3584
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2560

CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x2000
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
# MX25R64 supports 4KB sector erase; use it so log reclaim drops less data.
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# LiPo pack on BQ25895 — change when swapping to a larger cell.
CONFIG_BQ25895_BATT_CAPACITY_MAH=200
CONFIG_BQ25895_CHARGE_RATE_MILLIC=500

CONFIG_DK_LIBRARY=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# BQ25895 power/charge manager (register-level I2C access + INT GPIO)
CONFIG_I2C=y
CONFIG_GPIO=y

# UART shell on console (uart20). Interrupt-driven RX is required for reliable
# input on nRF54L UARTE (EasyDMA); polling often never sees keystrokes.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
CONFIG_SHELL_PROMPT_UART="hub> "
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=128
# Do not gate TX on DTR (screen/picocom often leave DTR awkward).
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n

# Quiet Zephyr/BT stack console by default (ERR only).
# App HUB_* logs default to external flash (see flog / loglevel); UART mirror off.
CONFIG_LOG_DEFAULT_LEVEL=1
